42.1875,3360.7488,629.6875,3373.2488" style="stroke: #383838; stroke-width: 3.125;"/><line style="stroke: #383838; stroke-width: 4.6875;" x1="839.0625" x2="1265.625" y1="3924.9983" y2="3924.9983"/><polygon fill="#383838" points="1253.125,3627.2798,1265.625,3596.0298,1278.125,3627.2798,1265.625,3614.7798" style="stroke: #383838; stroke-width: 4.6875;"/><line style="stroke: #383838; stroke-width: 4.6875;" x1="1265.625" x2="1265.625" y1="3291.9988" y2="3924.9983"/><line style="stroke: #383838; stroke-width: 4.6875;" x1="1265.625" x2="667.1875" y1="3291.9988" y2="3291.9988"/><polygon fill="#383838" points="698.4375,3279.4988,667.1875,3291.9988,698.4375,3304.4988,685.9375,3291.9988" style="stroke: #383838; stroke-width: 3.125;"/><line style="stroke: #383838; stroke-width: 4.6875;" x1="629.6875" x2="629.6875" y1="3794.9984" y2="3882.4359"/><polygon fill="#383838" points="617.1875,3851.1859,629.6875,3882.4359,642.1875,3851.1859,629.6875,3863.6859" style="stroke: #383838; stroke-width: 3.125;"/><line style="stroke: #383838; stroke-width: 4.6875;" x1="629.6875" x2="629.6875" y1="3967.5608" y2="4076.9358"/><polygon fill="#383838" points="617.1875,4045.6858,629.6875,4076.9358,642.1875,4045.6858,629.6875,4058.1858" style="stroke: #383838; stroke-width: 3.125;"/><line style="stroke: #383838; stroke-width: 4.6875;" x1="629.6875" x2="629.6875" y1="4309.6856" y2="4372.1856"/><polygon fill="#383838" points="617.1875,4340.9356,629.6875,4372.1856,642.1875,4340.9356,629.6875,4353.4356" style="stroke: #383838; stroke-width: 3.125;"/><!--MD5=[9cc13b759bfcc9c3141cdf5a922ed968]
@startuml
skinparam dpi 300
skinparam monochrome true
skinparam backgroundColor white
skinparam shadowing false
skinparam defaultFontName Helvetica
skinparam defaultFontSize 20


start
:Abrir una página de /admin\n(el middleware SSR consulta la sesión);
if (¿API disponible?) then ([no])
  :Responder 503;
  stop
else ([sí])
endif
if (¿Sesión vigente?\n(8 h, 30 min sin actividad)) then ([no])
  repeat
    :Escribir en /login correo y\ncontraseña, y enviarlos;
  backward:Mostrar el error del campo,\nla alerta genérica (401)\no el bloqueo temporal (429);
  repeat while (¿Datos completos, credenciales\nválidas y correo sin bloqueo?) is ([no]) not ([sí])
  :Crear la sesión (cookie HttpOnly);
else ([sí])
endif
if (¿Rol ADMINISTRADOR?) then ([no])
  :Mostrar «Acceso no\nautorizado» (403);
  stop
else ([sí])
endif
repeat
  :Elegir en el panel un módulo: unidades,\nresidentes, invitaciones, obligaciones,\npagos, reportes o feedback, y operar\nen él (parte 2);
