" x="923.4375" y="2997.4051">residentes, invitaciones, obligaciones,</text><text fill="#000000" font-family="Helvetica" font-size="62.5" lengthAdjust="spacingAndGlyphs" textLength="1062.5" x="923.4375" y="3082.5301">pagos, reportes o feedback, y operar</text><text fill="#000000" font-family="Helvetica" font-size="62.5" lengthAdjust="spacingAndGlyphs" textLength="393.75" x="923.4375" y="3167.655">en él (parte 2)</text><polygon fill="#F8F8F8" points="1490.625,2676.7178,1528.125,2714.2178,1490.625,2751.7178,1453.125,2714.2178,1490.625,2676.7178" style="stroke: #383838; stroke-width: 4.6875;"/><polygon fill="#F8F8F8" points="1318.75,3304.6549,1662.5,3304.6549,1700,3347.2174,1662.5,3389.7798,1318.75,3389.7798,1281.25,3347.2174,1318.75,3304.6549" style="stroke: #383838; stroke-width: 4.6875;"/><text fill="#000000" font-family="Helvetica" font-size="62.5" lengthAdjust="spacingAndGlyphs" textLength="118.75" x="1503.125" y="3456.5923">[no]</text><text fill="#000000" font-family="Helvetica" font-size="62.5" lengthAdjust="spacingAndGlyphs" textLength="343.75" x="1318.75" y="3371.4673">¿Continuar?</text><text fill="#000000" font-family="Helvetica" font-size="62.5" lengthAdjust="spacingAndGlyphs" textLength="90.625" x="1700" y="3328.9049">[sí]</text><rect fill="#F8F8F8" height="232.7498" rx="39.0625" ry="39.0625" style="stroke: #383838; stroke-width: 4.6875;" width="759.375" x="1110.9375" y="3499.1548"/><text fill="#000000" font-family="Helvetica" font-size="62.5" lengthAdjust="spacingAndGlyphs" textLength="696.875" x="1142.1875" y="3597.2173">Cerrar sesión (se revoca</text><text fill="#000000" font-family="Helvetica" font-size="62.5" lengthAdjust="spacingAndGlyphs" textLength="409.375" x="1142.1875" y="3682.3422">en el servidor)</text><ellipse cx="1490.625" cy="3828.7797" fill="#FFFFFF" rx="34.375" ry="34.375" style="stroke: #000000; stroke-width: 3.125;"/><ellipse cx="1490.625" cy="3828.7797" fill="#000000" rx="18.75" ry="18.75" style="stroke: #7F7F7F; stroke-width: 3.125;"/><