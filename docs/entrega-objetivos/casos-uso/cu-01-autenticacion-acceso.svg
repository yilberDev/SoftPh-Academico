@startuml
skinparam dpi 300
skinparam monochrome true
skinparam backgroundColor white
skinparam shadowing false
skinparam defaultFontName Helvetica
skinparam defaultFontSize 13
skinparam linetype polyline
skinparam packageStyle rectangle
skinparam packageTitleAlignment right
skinparam nodesep 30
skinparam ranksep 70
left to right direction
title Casos de uso: autenticación y control de acceso

actor "Administrador" as admin
actor "Residente" as resident

rectangle "SoftPh - Autenticación y control de acceso" {
  usecase "CU-001\nRegistrar administrador" as CU001
  usecase "CU-002\nIniciar sesión como\nadministrador" as CU002
  usecase "CU-007\nIniciar sesión como\nresidente" as CU007
  usecase "CU-016\nRestablecer contraseña" as CU016
  usecase "CU-018\nControlar acceso\nsegún rol" as CU018
}

admin - - CU001
admin - - CU002
resident - - CU007
resident - - CU016
CU002 ..> CU018 : <<include>>
CU007 ..> CU018 : <<include>>
CU016 .> CU007 : <<extend>>
@enduml

